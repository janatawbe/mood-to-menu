daemon off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets (Vite fingerprints filenames) — safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy API traffic to the backend container by its Compose service name. No path
    # is appended after the upstream address, so Nginx forwards the request URI
    # untouched — /api/recipes/generate stays /api/recipes/generate (the backend is
    # mounted at /api and would 404 on anything with that prefix stripped).
    location /api/ {
        proxy_pass https://mood-to-menu-75339.containers.snapdeploy.app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — this app doesn't currently use client-side routing (section
    # switching is in-memory state, not URL paths), but this keeps a direct
    # refresh/deep-link safe rather than returning Nginx's own 404.
    location / {
        try_files $uri /index.html;
    }
}
